[package]
name = "md-viewer"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
description = "A local Markdown reader for everyone"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
open = { version = "=5.3.3", features = ["shellexecute-on-windows"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
pulldown-cmark = "0.13"
base64 = "0.22"
percent-encoding = "2"
notify = "8.2.1"
serde_json = "1"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[lib]
name = "md_viewer"
path = "src/lib.rs"



[target.'cfg(unix)'.dependencies]
libc = "0.2"
