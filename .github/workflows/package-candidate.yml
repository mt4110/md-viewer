name: Package Windows test candidate
on:
  push:
    branches: [feat/md-viewer]
    paths:
      - .github/workflows/package-candidate.yml
      - reader/**
      - Cargo.toml
      - Cargo.lock
      - tools/package_md_viewer.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: npm ci --ignore-scripts
      - name: Build unsigned NSIS test candidate
        working-directory: reader
        run: npx --yes --package @tauri-apps/cli@2.12.4 tauri build --ci --no-sign --bundles nsis -- --locked
      - name: Package matching source and dependency inventory
        run: python tools/package_md_viewer.py candidate-source
      - name: Record installer hashes
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem reader/target/release/bundle/nsis/*.exe)
          if ($installers.Count -eq 0) { throw 'NSIS installer missing' }
          $installers | ForEach-Object {
            $digest = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          } | Set-Content candidate-source/INSTALLER_SHA256SUMS -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-test-candidate-${{ github.sha }}
          path: |
            reader/target/release/bundle/nsis/*.exe
            candidate-source/*
            docs/markdown-reader/WINDOWS_MANUAL_CHECK.md
          if-no-files-found: error
          retention-days: 7
      # Test artifacts only. No GitHub Release, tag creation or signing credentials.
