name: Package Windows test candidate
on:
  push:
    branches: [feat/md-viewer]
    paths:
      - .github/workflows/package-candidate.yml
      - reader/**
      - Cargo.toml
      - Cargo.lock
      - tools/package_md_viewer.py
      - tools/generate_notices.py
      - tools/license_overrides.json
      - tools/licenses/**
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: Upload unsigned candidate after reviewing notices and sharing scope
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: npm ci --ignore-scripts
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/generate_notices.py --check
      - name: Build unsigned NSIS test candidate
        working-directory: reader
        run: npx --yes --package @tauri-apps/cli@2.12.4 tauri build --ci --no-sign --bundles nsis -- --locked
      - name: Package matching source and dependency inventory
        run: python tools/package_md_viewer.py candidate-source
      - name: Record installer hashes
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem reader/target/release/bundle/nsis/*.exe)
          if ($installers.Count -eq 0) { throw 'NSIS installer missing' }
          $installers | ForEach-Object {
            $digest = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          } | Set-Content candidate-source/INSTALLER_SHA256SUMS -Encoding utf8
          [ordered]@{
            commit = $env:GITHUB_SHA
            ref = $env:GITHUB_REF_NAME
            target = 'x86_64-pc-windows-msvc'
            version = (Get-Content reader/tauri.conf.json -Raw | ConvertFrom-Json).version
            tauri_cli = '2.12.4'
            unsigned = $true
          } | ConvertTo-Json | Set-Content candidate-source/BUILD_INFO.json -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifact
        with:
          name: windows-test-candidate-${{ github.sha }}
          path: |
            reader/target/release/bundle/nsis/*.exe
            candidate-source/*
            docs/markdown-reader/WINDOWS_MANUAL_CHECK.md
            docs/markdown-reader/WINDOWS_TRIAL_v0.1.1.md
          if-no-files-found: error
          retention-days: 7
      # Test artifacts only. No GitHub Release, tag creation or signing credentials.
