name: Check md-viewer
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run check:rust
      - run: npm run check:docs
      - run: npm run test:ui
      - run: rustup run 1.95.0 cargo build --workspace --release --locked
      # No signing credentials, release upload or publish step.
